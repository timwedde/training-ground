[project]
name = "training-ground"
version = "0.1.0"
description = "Simple tool for training AI models."
readme = "README.md"
authors = [
    { name = "Tim Wedde", email = "tim@agrowizard.com" }
]
requires-python = ">=3.14"
dependencies = [
    "rfdetr[train,onnx]==1.12.1",
    "ultralytics[export-base]>=8.4.216",
    "typer>=0.25.1",
    "roboflow>=1.7.3",
    "questionary>=2.1.1",
    "pyyaml>=6.0.3",
    "faster-coco-eval>=1.8.1",
    "orjson>=3.13.0",
    "plotly>=7.1.0",
    "httpx>=0.28.1",
    "numpy>=2.5.5",
    "onnx>=1.23.2",
    "onnxsim[onnxruntime]>=0.8.1",
    "opencv-python>=5.1.0.95",
    "pillow>=13.0.0",
    "supervision>=0.32.0",
    "torch>=2.15.0",
]

[project.scripts]
training-ground = "training_ground.main:app"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"
